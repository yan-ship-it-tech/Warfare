name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/warfare-digital-twin-scaffold-19u7kt, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # First run had no Pages site to configure yet (repo Settings →
          # Pages had never been touched) and failed with "Get Pages site
          # failed... verify Pages is enabled". This creates the Pages site
          # via the API on first run instead of requiring that one manual
          # click — safe to leave on for every run after too.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
