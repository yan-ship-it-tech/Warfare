name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/warfare-digital-twin-scaffold-19u7kt, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Unset by default — the app falls back to this-browser-only
          # storage (src/state/persistence.ts) until these are set. Once
          # you've deployed worker/ (see docs/DEPLOY_SYNC_WORKER.md), add
          # SYNC_URL as a repo secret (Settings → Secrets and variables →
          # Actions) and every subsequent build picks it up automatically —
          # no other change needed here. Vite bakes VITE_ vars in at build
          # time, so this has to happen in the build step, not at runtime.
          VITE_SYNC_URL: ${{ secrets.SYNC_URL }}
          VITE_SYNC_TOKEN: ${{ secrets.SYNC_WRITE_TOKEN }}
      # Tried enablement: true to have this bootstrap the Pages site itself
      # on first run — GitHub's own security model blocks that: the default
      # GITHUB_TOKEN (whatever permissions the workflow grants it) cannot
      # *create* a Pages site, confirmed via "Resource not accessible by
      # integration" even with pages: write above. Enabling Pages for the
      # first time genuinely requires either a human in Settings → Pages, or
      # a personal access token with repo-admin scope — there is no
      # workflow-only path around that. So: one manual step, once —
      # Settings → Pages → Source → "GitHub Actions" — and every push
      # deploys automatically after that.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
